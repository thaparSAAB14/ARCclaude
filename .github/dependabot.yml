version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "nuget"
    directory: "/addin/ARCclaude.Addin"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "addin"]
    # The Esri SDK package tracks the installed ArcGIS Pro version; do not let
    # Dependabot push it ahead of what users actually have.
    ignore:
      - dependency-name: "Esri.ArcGISPro.Extensions30"
